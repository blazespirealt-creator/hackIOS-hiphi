name: Build UEFI for Motorola Edge 30 Pro (hiphi)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          apt-get update && apt-get install -y \
            build-essential \
            uuid-dev \
            iasl \
            git \
            python3 \
            python3-pip \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            nasm \
            acpica-tools \
            zip

      - name: Set up Environment and Compile UEFI
        run: |
          # If your repository has a custom build script, it will execute here.
          # Otherwise, adjust this step to match your project's compile commands for SM8450 / hiphi.
          if [ -f "build.sh" ]; then
            bash build.sh --device hiphi
          elif [ -f "compile.sh" ]; then
            bash compile.sh hiphi
          else
            echo "No standard build script found. Please check your repository structure."
            exit 1
          fi

      - name: Upload Built UEFI Image
        uses: actions/upload-artifact@v4
        with:
          name: Mu-hiphi-UEFI
          path: |
            *.img
            **/Mu-hiphi*.img
            build/workspace/Build/**/*.img
