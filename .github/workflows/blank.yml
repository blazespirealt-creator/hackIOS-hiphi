name: Build UEFI for Motorola Edge 30 Pro (hiphi)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            uuid-dev \
            iasl \
            git \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            nasm \
            acpica-tools \
            zip \
            mono-devel
          python -m pip install --upgrade pip
          pip install edk2-pytool-library edk2-pytool-extensions setup-cfg-fmt

      - name: Run Build Script
        run: |
          chmod +x build.sh
          ./build.sh hiphi

      - name: Upload Built UEFI Image
        uses: actions/upload-artifact@v4
        with:
          name: Mu-hiphi-UEFI
          path: |
            **/*.img
            **/*.bin
            **/*.fd
            Build/**/*.fd
            Build/**/*.img
