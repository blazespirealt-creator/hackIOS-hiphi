
name: HackiOS hiphi UEFI Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Motorola device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential clang lld llvm \
            nasm python3 python3-pip python3-venv \
            device-tree-compiler uuid-dev \
            acpica-tools gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Checkout HackiOS
        uses: actions/checkout@v4
        with:
          repository: oosexgang/hackios-xnu-kernel
          path: hackios

      - name: Prepare device configuration
        run: |
          set -eux
          cd hackios

          test -f ../device/hiphi.dtb

          common/new-device.sh hiphi ../device/hiphi.dtb

          test -f common/devices/hiphi.conf
          test -f common/devices/hiphi.platform.c

      - name: Prepare Mu-Silicium source
        run: |
          set -eux
          cd hackios

          bash uefi/apply.sh

          test -f Mu-Silicium/build_uefi.py

      - name: Check Motorola platform implementation
        run: |
          set -eu
          cd hackios

          echo "Checking for a real hiphi UEFI platform."

          find Mu-Silicium/Platforms \
            -maxdepth 3 -type d -print

          if [ ! -d Mu-Silicium/Platforms/Motorola/hiphiPkg ]; then
            echo "::error::Motorola hiphiPkg is missing."
            echo "Implement the hiphi platform package before building."
            exit 1
          fi

          if [ ! -d Mu-Silicium/Binaries/hiphi ]; then
            echo "::error::hiphi firmware drivers are missing."
            exit 1
          fi

      - name: Install Python requirements
        run: |
          set -eux
          cd hackios

          python3 -m venv venv
          venv/bin/pip install \
            -r Mu-Silicium/pip-requirements.txt

      - name: Build Motorola UEFI
        run: |
          set -eux
          cd hackios

          ln -sfn /usr/bin/nasm \
            Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep/Linux-x86-64/nasm

          ln -sfn /usr/bin/ndisasm \
            Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep/Linux-x86-64/ndisasm

          cd Mu-Silicium
          source ../venv/bin/activate

          python3 build_uefi.py \
            -d hiphi \
            -r RELEASE

      - name: Package UEFI build artifacts
        run: |
          set -eux
          cd hackios

          mkdir -p ../artifacts

          find Mu-Silicium/Build/hiphiPkg \
            -name SILICIUM_UEFI.fd \
            -type f \
            -exec cp {} ../artifacts/hiphi-uefi.fd \;

          test -s ../artifacts/hiphi-uefi.fd

          sha256sum ../artifacts/hiphi-uefi.fd \
            > ../artifacts/SHA256SUMS.txt

      - name: Upload UEFI artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hiphi-uefi-build
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
