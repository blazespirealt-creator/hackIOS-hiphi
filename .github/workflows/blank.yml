name: Build UEFI for Motorola Edge 30 Pro (hiphi)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            uuid-dev \
            iasl \
            git \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            nasm \
            acpica-tools \
            zip \
            mono-devel
          python -m pip install --upgrade pip
          pip install edk2-pytool-library edk2-pytool-extensions setup-cfg-fmt

      - name: Compile UEFI Image
        run: |
          # Set GCC arm64 toolchain environment variables
          export GCC5_AARCH64_PREFIX=aarch64-linux-gnu-

          # Find and execute the Python build script in the repository
          if [ -f "build.py" ]; then
            python3 build.py -d hiphi
          elif [ -f "edk2_build.py" ]; then
            python3 edk2_build.py -d hiphi
          elif [ -f "Platforms/hiphi/platform.build.py" ]; then
            python3 Platforms/hiphi/platform.build.py
          else
            echo "Searching for available build scripts..."
            BUILD_SCRIPT=$(find . -maxdepth 2 -name "*build*.py" | head -n 1)
            if [ -n "$BUILD_SCRIPT" ]; then
              python3 "$BUILD_SCRIPT" -d hiphi
            else
              echo "Error: No Python build script found in repository."
              exit 1
            fi
          fi

      - name: Upload Built UEFI Image
        uses: actions/upload-artifact@v4
        with:
          name: Mu-hiphi-UEFI
          path: |
            **/*.img
            **/*.bin
            **/*.fd
