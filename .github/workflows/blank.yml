name: Build UEFI for Motorola Edge 30 Pro (hiphi)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            uuid-dev \
            iasl \
            git \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            nasm \
            acpica-tools \
            zip \
            mono-devel
          python -m pip install --upgrade pip
          pip install edk2-pytool-library edk2-pytool-extensions setup-cfg-fmt

      - name: Locate and Compile UEFI Image
        run: |
          # Set GCC arm64 toolchain environment variables
          export GCC5_AARCH64_PREFIX=aarch64-linux-gnu-

          echo "Searching for build scripts across the repository..."
          find . -name "*build*.py" -o -name "BuildConfig.py"

          # Find and execute the first matching build script
          BUILD_SCRIPT=$(find . -name "*build*.py" -o -name "BuildConfig.py" | head -n 1)

          if [ -n "$BUILD_SCRIPT" ]; then
            echo "Executing build script: $BUILD_SCRIPT"
            python3 "$BUILD_SCRIPT" --device hiphi || python3 "$BUILD_SCRIPT" -d hiphi
          else
            echo "Error: No Python build script found in repository or submodules."
            exit 1
          fi

      - name: Upload Built UEFI Image
        uses: actions/upload-artifact@v4
        with:
          name: Mu-hiphi-UEFI
          path: |
            **/*.img
            **/*.bin
            **/*.fd
